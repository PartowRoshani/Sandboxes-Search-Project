[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sand-grid-search-project"
version = "2.0.0"
description = "Sand-grid search with continuous-flow persistent gates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.6,<4", "Pillow>=9,<13"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
sandgrid = "sandgrid.cli:main"

[tool.setuptools.packages.find]
include = ["sandgrid*"]
